kind: pod
name: Software Factory
description: A request goes in. A planned, built, reviewed, and tested pull
  request comes out, ready for you to merge.
brandColor: "#0f172a"
categories:
  roles:
    - engineer
    - devops
    - product-manager
  usecases:
    - release-management
    - incident-response
  functions:
    - code-review
    - deployment
    - alerting
    - document-generation
    - summarization
  verticals:
    - engineering-factory
examplePrompts:
  - Here is a bug report from Slack. Work out what is wrong and plan the fix on
    Linear.
  - REN-123 is approved. Build it.
  - What did we ship yesterday, and did anything move in production after it?
pod:
  name: Software Factory
  description: Plan, Build, Review, QA, and Monitoring. Linear holds the issue and
    its plan, GitHub holds the code and the review, and Ren tasks move work
    between projects.
  defaultModel:
    model: claude-opus-5-5
    variant: null
  environment:
    def:
      cpuCount: 8
      memoryMB: 8192
      packages:
        apt:
          - gh
          - ffmpeg
          - ripgrep
      networking:
        type: unrestricted
