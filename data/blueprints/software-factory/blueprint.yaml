kind: pod
name: Software Factory
description: A request goes in. A planned, built, reviewed, and tested pull
  request comes out, ready for you to merge.
brandColor: "#0f172a"
categories:
  roles:
    - engineer
    - devops
    - product-manager
  usecases:
    - release-management
    - incident-response
  functions:
    - code-review
    - deployment
    - alerting
    - document-generation
    - summarization
  verticals:
    - engineering-factory
examplePrompts:
  - Here is a bug report from Slack. Work out what is wrong and plan the fix on
    Linear.
  - REN-123 is approved. Build it.
  - What did we ship yesterday, and did anything move in production after it?
pod:
  name: Software Factory
  description: Plan, Build, Review, QA, and Monitoring. Linear holds the issue and
    its plan, GitHub holds the code and the review, and Ren tasks move work
    between projects.
  defaultModel:
    model: claude-opus-5-5
    variant: null
  environment:
    def:
      cpuCount: 8
      memoryMB: 8192
      packages:
        apt:
          - gh
          - ffmpeg
          - ripgrep
          - docker.io
          - docker-compose
          - xvfb
          - xdg-utils
          - chromium
          - libgtk-3-0
          - libnss3
          - libgbm1
          - libasound2
        npm:
          - agent-browser@0.38.1
      networking:
        type: unrestricted
      buildCommands:
        - sudo usermod -aG docker user
        - '"$(npm prefix -g)/bin/agent-browser" install --with-deps'
        - cd "$(mktemp -d)" && curl -fsSL
          https://download.paper.design/linux/appImage -o paper.AppImage &&
          chmod +x paper.AppImage && ./paper.AppImage --appimage-extract
          >/dev/null && sudo mv squashfs-root /opt/paper
        - cd "$(mktemp -d)" && curl -fsSL -o cua.tgz
          https://github.com/trycua/cua/releases/download/cua-driver-rs-v0.32.0/cua-driver-rs-0.32.0-linux-x86_64-binary.tar.gz
          && echo
          'bb006010864e9a93b9f67035e345c3a076f0908d42fbe493bb21ede5f82f39a6  cua.tgz'
          | sha256sum -c - && sudo mkdir -p /opt/cua-driver && sudo tar xzf
          cua.tgz -C /opt/cua-driver cua-driver libcua_driver_sdk.so && sudo ln
          -sf /opt/cua-driver/cua-driver /usr/local/bin/cua-driver && cua-driver
          telemetry disable
        - printf '#!/bin/sh\nexec chromium --no-sandbox --disable-dev-shm-usage
          --no-first-run --no-default-browser-check --password-store=basic
          --user-data-dir=/tmp/paper-signin-browser --remote-debugging-port=0
          "$@"\n' | sudo tee /usr/local/bin/paper-signin-browser >/dev/null &&
          sudo chmod +x /usr/local/bin/paper-signin-browser && printf '[Desktop
          Entry]\nType=Application\nName=Paper sign-in
          browser\nExec=/usr/local/bin/paper-signin-browser
          %%U\nMimeType=x-scheme-handler/http;x-scheme-handler/https;\nNoDisplay=true\n'
          | sudo tee /usr/share/applications/paper-signin-browser.desktop
          >/dev/null && printf '[Desktop
          Entry]\nType=Application\nName=Paper\nExec=/opt/paper/paper-desktop
          --no-sandbox %%U\nMimeType=x-scheme-handler/paper;\nNoDisplay=true\n'
          | sudo tee /usr/share/applications/paper.desktop >/dev/null && printf
          '[Default
          Applications]\nx-scheme-handler/paper=paper.desktop\nx-scheme-handler/http=paper-signin-browser.desktop\nx-scheme-handler/https=paper-signin-browser.desktop\n'
          | sudo tee /etc/xdg/mimeapps.list >/dev/null && sudo mkdir -p
          /etc/chromium/policies/managed && echo
          '{"AutoLaunchProtocolsFromOrigins":[{"protocol":"paper","allowed_origins":["https://workers.paper.design"]}]}'
          | sudo tee /etc/chromium/policies/managed/paper.json >/dev/null
        - >
          sudo tee /usr/local/bin/paper-start >/dev/null <<'EOF'

          #!/bin/bash

          set -eu

          export DISPLAY=:99

          log="$HOME/.paper-mcp.log"

          up() { curl -s -o /dev/null --max-time 2 http://127.0.0.1:29979/mcp; }

          exec 9>"$HOME/.paper-mcp.lock"

          flock 9

          if ! up; then
            if [ ! -e /tmp/.X11-unix/X99 ]; then Xvfb :99 -screen 0 1440x900x24 >>"$log" 2>&1 9>&- & fi
            for _ in $(seq 20); do [ -e /tmp/.X11-unix/X99 ] && break; sleep 0.5; done
            if ! pgrep -f '^/opt/paper/paper-desktop --no-sandbox$' >/dev/null; then
              setsid /opt/paper/paper-desktop --no-sandbox >>"$log" 2>&1 9>&- &
            fi
            for _ in $(seq 60); do up && break; sleep 1; done
            up || { echo "Paper did not start. See $log" >&2; exit 1; }
          fi

          EOF

          printf '#!/bin/sh\npaper-start || exit 1\nexec
          /opt/paper/resources/app.asar.unpacked/dist/cli-bin/linux-x64/paper
          mcp\n' | sudo tee /usr/local/bin/paper-mcp >/dev/null

          sudo chmod +x /usr/local/bin/paper-start /usr/local/bin/paper-mcp
