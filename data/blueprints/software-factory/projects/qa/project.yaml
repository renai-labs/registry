name: QA
description: "Runs the change and tries to break it: the app and a local
  browser, both in the sandbox. Marks the pull request ready when it holds up.
  Starts when a task assigned to it is started."
defaultModel:
  model: claude-opus-5-5
  variant: medium
permission:
  bash:
    "*": allow
    git push*: deny
    gh pr close*: deny
    gh pr merge*: deny
    gh pr review*: deny
    git branch -D*: deny
    gh repo delete*: deny
  webfetch: allow
skills:
  - agent-browser
  - e2e-verification
mcps:
  - linear
  - slack
buildOrder: 4
