name: QA
description: "Runs the change and tries to break it: the app in the sandbox, the
  browser on Kernel. Marks the pull request ready when it holds up. Starts when
  a task assigned to it is started."
defaultModel:
  model: gpt-6-astra
  variant: low
permission:
  bash:
    "*": allow
    git push*: deny
    gh pr close*: deny
    gh pr merge*: deny
    gh pr review*: deny
    git branch -D*: deny
    gh repo delete*: deny
  webfetch: allow
skills:
  - e2e-verification
mcps:
  - kernel
  - linear
  - slack
buildOrder: 4
