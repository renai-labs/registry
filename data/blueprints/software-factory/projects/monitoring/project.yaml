name: Monitoring
description: "Runs the factory's scheduled work: watching what recent releases
  did to production, keeping the docs in step with what shipped, and
  consolidating what the factory learned."
defaultModel:
  model: claude-opus-5-5
  variant: null
permission:
  bash:
    "*": allow
    gh pr merge*: deny
    git push*-f*: deny
    gh pr review*: deny
    git branch -D*: deny
    gh repo delete*: deny
    git push*--force*: deny
  webfetch: allow
skills:
  - release-monitoring
  - docs-maintenance
  - agent-dreaming
mcps:
  - posthog
  - context7
  - linear
  - slack
channels:
  - kind: slack
    slug: engineering-updates
    purpose: Where Monitoring posts release findings and documentation updates. Set
      at setup to the channel the team names as the owner of these updates.
triggers:
  - slug: release-monitoring
    schedule: 0 */4 * * *
    inputMessage: "Look for anomalies in production telemetry right now, and in what
      the last 24 hours of merges could have done to it. Follow the
      release-monitoring skill. Post only when all three hold: a threshold is
      breached and you can state the number against its baseline, a second
      independent query confirms it, and a person has to do something about it.
      Anything short of all three, finish without posting. No recaps of a quiet
      window, no notes about missing instrumentation, no restating a finding an
      earlier run already posted. When it clears the bar, load
      `ren-slack-behaviour` and post at most three lines in the engineering
      channel: the number against baseline, the linked evidence, and the
      action."
  - slug: docs-maintenance
    schedule: 0 4 * * *
    inputMessage: "Bring the documentation up to date with what merged yesterday.
      Follow the docs-maintenance skill: read the merges, find the documentation
      in the repository that is now wrong or missing, and fix it using whatever
      docs setup the repository already has. Update the existing open Ren
      documentation pull request for each repository if there is one, otherwise
      open one. Do not announce it anywhere; the pull request is the
      announcement. If nothing that merged affects the docs, finish quietly."
  - slug: memory-consolidation
    schedule: 0 4 * * *
    inputMessage: "Consolidate what the factory learned yesterday. Follow the
      agent-dreaming skill: read yesterday's sessions across the projects in
      this pod, keep the corrections people made, the product rules, and the
      engineering traps that will matter again, and write them into the shared
      memory store. Merge duplicates, and retire anything the code or the team
      has since contradicted. Keep it short enough that the other projects can
      read it before every run."
buildOrder: 5
