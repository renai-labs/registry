name: Build
description: Turns an approved plan into a draft pull request, fixes what Review
  and QA send back, and makes the changes a person asks for once it is ready.
  Starts when a task assigned to it is started.
defaultModel:
  model: claude-opus-5-5
  variant: medium
permission:
  bash:
    "*": allow
    gh pr merge*: deny
    gh pr ready*: deny
    git push*-f*: deny
    gh pr review*: deny
    git branch -D*: deny
    gh repo delete*: deny
    git push*--force*: deny
    git push*--delete*: deny
  webfetch: allow
skills:
  - code-quality
mcps:
  - linear
  - slack
buildOrder: 2
