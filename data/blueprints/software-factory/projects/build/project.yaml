name: Build
description: Turns an approved plan into a draft pull request, fixes what Review
  and QA send back, and makes the changes a person asks for once it is ready.
  Starts when a task assigned to it is started.
defaultModel:
  model: claude-opus-5-5
  variant: medium
permission:
  bash:
    "*": allow
    gh pr merge*: deny
    gh pr ready*: deny
    git push*-f*: deny
    gh pr review*: deny
    git branch -D*: deny
    gh repo delete*: deny
    git push*--force*: deny
    git push*--delete*: deny
  webfetch: allow
skills:
  - code-quality
  - paper-design
mcps:
  - linear
  - slack
  - paper
triggers:
  - slug: paper-sync
    schedule: "*/15 * * * *"
    inputMessage: Promote merged Paper designs. Follow paper-design's Promote
      section. If nothing is ready, finish without posting.
buildOrder: 2
