name: Plan
description: Takes a request from Slack or chat, works out what is actually
  being asked, and writes the implementation plan on a Linear issue. Hands the
  approved plan to Build.
defaultModel:
  model: gpt-6.1-sol
  variant: low
permission:
  bash:
    "*": allow
    git push*: deny
    gh pr merge*: deny
    gh pr review*: deny
  webfetch: allow
skills:
  - paper-design
mcps:
  - slack
  - linear
  - linear-ren
  - paper
channels:
  - kind: slack
    slug: issue-intake
    purpose: Where people report bugs and ask for things. A mention here reaches Plan.
  - kind: linear
    slug: issue-tracker
    purpose: The Linear project the factory works in. Mentioning Ren on an issue
      reaches Plan.
buildOrder: 1
